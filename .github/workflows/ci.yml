name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      # Includes the skill drift test: a SKILL.md that names a command or flag
      # the binary does not have makes agents confidently wrong.
      - run: go test -race -count=1 ./...

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -count=1 ./...

  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: The plugin publishes cleanly
        run: |
          git clone --depth 1 https://github.com/getadaa/plugins.git /tmp/plugins
          scripts/publish-plugin.sh 0.0.0-ci /tmp/plugins
          jq -e '.plugins[] | select(.name == "adaa")' /tmp/plugins/.claude-plugin/marketplace.json
